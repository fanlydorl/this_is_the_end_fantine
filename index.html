<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantine prend la porte — Pot de départ</title>
  <meta name="description" content="Une mission en 4 niveaux. Un message codé vous attend au bout.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
  <style>
/* Fantine prend la porte — styles globaux */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #1c2b35;
  font-family: 'Fredoka', sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; }
a { color: #d9412b; }
a:hover { color: #2b1a12; }
button { -webkit-appearance: none; appearance: none; }
.press:active {
  transform: translate(3px, 3px) !important;
  box-shadow: 1px 1px 0 #2b1a12 !important;
}
.press-item:active {
  transform: translate(-50%, -50%) translate(2px, 2px) !important;
  box-shadow: 2px 2px 0 #2b1a12 !important;
}
.noscript {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px; color: #fff6e0; text-align: center; font-size: 18px;
}
.crash {
  position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
  align-items: center; justify-content: center; color: #fff6e0; font-size: 20px; text-align: center; padding: 24px;
}
.crash button {
  font-family: 'Luckiest Guy', sans-serif; font-size: 20px; padding: 12px 22px 8px;
  background: #ffd23f; color: #2b1a12; border: 3px solid #2b1a12; border-radius: 14px;
  box-shadow: 4px 4px 0 #2b1a12; cursor: pointer;
}
</style>
</head>
<body>
  <div id="app"></div>
  <noscript><div class="noscript">Activez JavaScript pour lancer la mission.</div></noscript>

          <div style="display:flex;gap:12px;align-items:baseline"><span style="font-family:'Luckiest Guy',sans-serif;font-size:14px;letter-spacing:0.04em;color:#d9412b;min-width:52px">QUAND</span><span style="font-size:17px;font-weight:600;color:#2b1a12">${v.dateLabel}, ${v.timeLabel}</span></div>
          <div style="display:flex;gap:12px;align-items:baseline"><span style="font-family:'Luckiest Guy',sans-serif;font-size:14px;letter-spacing:0.04em;color:#d9412b;min-width:52px">OÙ</span><span style="font-size:17px;font-weight:600;color:#2b1a12">${v.place}</span></div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <button onClick=${v.rsvpYes} style="font-family:'Luckiest Guy',sans-serif;font-size:21px;letter-spacing:0.03em;padding:13px 22px 9px;background:#ffd23f;color:#2b1a12;border:3px solid #2b1a12;border-radius:14px;box-shadow:4px 4px 0 #2b1a12;cursor:pointer" class="press">Je viens !</button>
          <button onClick=${v.replay} style="font-family:'Luckiest Guy',sans-serif;font-size:21px;letter-spacing:0.03em;padding:13px 22px 9px;background:#ffffff;color:#2b1a12;border:3px solid #2b1a12;border-radius:14px;box-shadow:4px 4px 0 #2b1a12;cursor:pointer" class="press">Rejouer</button>
        </div>
      </div>
    </div>
  ` : null}
</div>`;
}
Game.prototype.render = function () { return view(this.renderVals()); };

// Filet de sécurité : en cas d'erreur, on affiche un message au lieu d'un écran vide
class Safe extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { console.error('[Pot de départ]', err); }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div class="crash"><div>Oups, la mission a déraillé.</div><button class="press" onClick=${() => location.reload()}>Relancer</button></div>`;
  }
}
ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(Safe, null, React.createElement(Game, CONFIG)));

</script>
</body>
</html>
